# RTX 4090 environment: preserve the legacy PyG 1.7.2 data format and Transformers API.
# DGL is omitted: these three GIMLET/GIFT experiment paths do not import it.
name: env_gift

channels:
  - https://repo.anaconda.com/pkgs/main

dependencies:
  - python=3.8.20
  - pip=24.0
  - pip:
      - --index-url https://pypi.org/simple
      - --find-links https://download.pytorch.org/whl/torch_stable.html
      - torch==2.0.1+cu118
      - torchaudio==2.0.2+cu118
      - https://data.pyg.org/whl/torch-2.0.0%2Bcu118/torch_scatter-2.1.2%2Bpt20cu118-cp38-cp38-linux_x86_64.whl
      - https://data.pyg.org/whl/torch-2.0.0%2Bcu118/torch_sparse-0.6.18%2Bpt20cu118-cp38-cp38-linux_x86_64.whl
      - https://data.pyg.org/whl/torch-2.0.0%2Bcu118/torch_cluster-1.6.3%2Bpt20cu118-cp38-cp38-linux_x86_64.whl
      - https://data.pyg.org/whl/torch-2.0.0%2Bcu118/torch_spline_conv-1.2.2%2Bpt20cu118-cp38-cp38-linux_x86_64.whl
      - torch-geometric==1.7.2
